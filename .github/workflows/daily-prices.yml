# Runs every day on GitHub's servers, so the log keeps going when your computer is off.
# It adds the day's prices to data/prices.csv, rebuilds the dashboard and saves both
# back to the repository. You can also run it by hand: Actions tab → Daily prices → Run workflow.
name: Daily prices

on:
  schedule:
    # 22:30 UTC = 4:00 am in India, after both the Indian and the US markets have closed.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Log today's prices
        run: python log_prices.py

      - name: Rebuild the dashboard
        run: python build_dashboard.py

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv dashboard/index.html
          if git diff --cached --quiet; then
            echo "No new prices today (market holiday or weekend)."
          else
            git commit -m "Log prices for $(date -u +%Y-%m-%d)"
            git push
          fi
