# Runs every day on GitHub's servers, so the log keeps going when your computer is off.
# It adds the day's prices to data/prices.csv, rebuilds the dashboard, saves both back
# to the repository and publishes the dashboard to GitHub Pages:
# https://samarthkalani0-lab.github.io/Stock-Charter/
# (Pages must be set to Source: GitHub Actions in Settings → Pages.)
# You can also run it by hand: Actions tab → Daily prices → Run workflow.
name: Daily prices

on:
  schedule:
    # 22:30 UTC = 4:00 am in India, after both the Indian and the US markets have closed.
    - cron: "30 22 * * *"
  workflow_dispatch:
  # Also run when the job or the scripts change, so an update takes effect straight away.
  # The job's own daily commits only touch data/ and dashboard/, so they don't trigger it.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-prices.yml"
      - "portfolio.csv"
      - "log_prices.py"
      - "build_dashboard.py"
      - "portfolio.py"
      - "requirements.txt"

permissions:
  contents: write   # save the log and dashboard back to the repository
  pages: write      # publish the dashboard to GitHub Pages
  id-token: write   # required by GitHub Pages

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The public dashboard: https://samarthkalani0-lab.github.io/Stock-Charter/
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Log today's prices
        run: python log_prices.py

      - name: Rebuild the dashboard
        run: python build_dashboard.py

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv dashboard/index.html
          if git diff --cached --quiet; then
            echo "No new prices today (market holiday or weekend)."
          else
            git commit -m "Log prices for $(date -u +%Y-%m-%d)"
            git push
          fi

      # Publish the dashboard folder as the public website (its index.html is the home page).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deploy
        uses: actions/deploy-pages@v4
